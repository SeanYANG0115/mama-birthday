<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#160e16">
  <meta name="description" content="妈妈，生日快乐！愿你每天都像花儿一样，温柔而明亮。">
  <title>妈妈，生日快乐！</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:radial-gradient(ellipse at 50% 43%,#251b3d 0,#110e23 47%,#080a17 100%);color:#fff7f0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
    .vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,8,16,.16),transparent 25%,transparent 72%,rgba(10,8,16,.52))}
    .greeting{position:fixed;left:0;right:0;bottom:max(8vh,38px);text-align:center;padding:0 16px;animation:rise 2.2s both;pointer-events:none;text-shadow:0 2px 20px #b52b4a66}
    h1{font-weight:500;font-size:clamp(30px,8vw,48px);letter-spacing:.12em;margin:0 0 13px;color:#fff0e8}
    p{margin:0;color:#f1c9bd;font-size:clamp(14px,4vw,17px);letter-spacing:.12em;opacity:.9}
    .hint{position:fixed;top:max(24px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#eac8c344;font-size:12px;letter-spacing:.18em;animation:fade 3s 2s both}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.greeting,.hint{animation:none}}
  </style>
</head>
<body>
  <canvas id="stars"></canvas><canvas id="rose" aria-label="一束粉白色粒子玫瑰缓缓旋转"></canvas>
  <div class="vignette"></div>
  
  <main class="greeting"><h1>妈妈生日快乐</h1></main>
  <script>
(()=>{
 const c=document.getElementById('stars'),ctx=c.getContext('2d');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let w,h,stars=[],rockets=[],particles=[],last=0,next=0,side=0;
 const colors=['255,205,139','234,164,255','255,163,194','154,210,255'];
 function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:150},()=>[Math.random()*w,Math.random()*h,Math.random()*1.2+.2,Math.random()*7]);rockets=[];particles=[];}
 function launch(){side=1-side;const tx=w*(side?.16:.84)+(Math.random()-.5)*w*.12,ty=h*(.16+Math.random()*.29);rockets.push({x:tx+(Math.random()-.5)*w*.12,y:h*.82,tx,ty,color:colors[Math.floor(Math.random()*colors.length)]});}
 function explode(r){const radius=Math.min(w*.34,h*.25,210);for(let i=0;i<95;i++){const a=i/95*Math.PI*2+Math.random()*.05,speed=radius*(.55+Math.random()*.45);particles.push({x:r.tx,y:r.ty,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,age:0,life:2.2+Math.random()*.8,color:r.color});}}
 function frame(now){const dt=Math.min((now-last)/1000||.016,.04);last=now;ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='source-over';
 for(const s of stars){ctx.fillStyle=`rgba(220,210,255,${.25+.2*Math.sin(now*.0006+s[3])})`;ctx.beginPath();ctx.arc(s[0],s[1],s[2],0,7);ctx.fill();}
 if(now>next){launch();next=now+800+Math.random()*500;}
 ctx.globalCompositeOperation='lighter';
 for(let i=rockets.length-1;i>=0;i--){const r=rockets[i],dx=r.tx-r.x,dy=r.ty-r.y,len=Math.hypot(dx,dy),step=h*.52*dt;if(len<=step){explode(r);rockets.splice(i,1);continue;}r.x+=dx/len*step;r.y+=dy/len*step;const g=ctx.createLinearGradient(r.x,r.y,r.x-dx/len*26,r.y-dy/len*26);g.addColorStop(0,`rgba(${r.color},.7)`);g.addColorStop(1,`rgba(${r.color},0)`);ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-dx/len*26,r.y-dy/len*26);ctx.stroke();}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;if(p.age>=p.life){particles.splice(i,1);continue;}p.vx*=Math.exp(-.7*dt);p.vy=p.vy*Math.exp(-.7*dt)+22*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const alpha=Math.pow(1-p.age/p.life,1.4)*.98;ctx.strokeStyle=`rgba(${p.color},${alpha})`;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.1,p.y-p.vy*.1);ctx.stroke();ctx.fillStyle=`rgba(${p.color},${alpha})`;ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill();}
 ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame);}
 resize();explode({tx:w*.2,ty:h*.25,color:colors[0]});explode({tx:w*.8,ty:h*.37,color:colors[2]});addEventListener('resize',resize,{passive:true});requestAnimationFrame(frame);
})();

  (()=>{
    const canvas=document.querySelector('#rose');
    const gl=canvas.getContext('webgl',{alpha:true,antialias:true,depth:true,premultipliedAlpha:false});
    if(!gl){return}
    const vertex=`
      attribute vec3 aPosition;
      attribute vec3 aColor;
      attribute float aSize;
      attribute float aDelay;
      attribute float aAlpha;
      uniform float uTime;
      uniform float uAngle;
      uniform float uScale;
      uniform float uCenterY;
      uniform float uFocal;
      uniform float uDpr;
      uniform vec2 uViewport;
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        float c=cos(uAngle),s=sin(uAngle);
        float x=aPosition.x*c+aPosition.z*s;
        float z=-aPosition.x*s+aPosition.z*c;
        float cameraZ=uFocal-z;
        float appear=smoothstep(aDelay,aDelay+.8,uTime);
        float persp=uFocal/cameraZ;
        float clipX=2.0*x*uScale*uFocal/uViewport.x;
        float clipY=2.0*aPosition.y*uScale*uFocal/uViewport.y+uCenterY*cameraZ;
        float near=1.0,far=40.0;
        float clipZ=(far+near)/(far-near)*cameraZ-(2.0*far*near)/(far-near);
        gl_Position=vec4(clipX,clipY,clipZ,cameraZ);
        gl_PointSize=clamp(aSize*uScale*persp*uDpr*.65,1.0,5.0);
        vColor=aColor;
        vAlpha=aAlpha*appear;
      }`;
    const fragment=`
      precision mediump float;
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        vec2 p=gl_PointCoord-.5;
        float d=length(p)*2.0;
        if(d>1.0) discard;
        float soft=1.0-smoothstep(.25,1.0,d);
        float core=1.0-smoothstep(0.0,.42,d);
        gl_FragColor=vec4(vColor*(.78+.22*core),vAlpha*soft);
      }`;
    function shader(type,source){const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}
    const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS))return;
    gl.useProgram(program);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.disable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
    let w,h,dpr,scale=1,buffer,vertexCount=0,start=performance.now();
    const rand=(a,b)=>a+Math.random()*(b-a),verts=[];
    const rgb={cream:[1,.80,.70],pale:[1,.65,.81],light:[.94,.38,.66],rose:[.77,.25,.52],deep:[.57,.15,.38],leaf:[.32,.48,.27],leaf2:[.56,.68,.39],paper:[.78,.43,.37],paper2:[.94,.68,.58],stem:[.35,.48,.27]};
    function put(x,y,z,color,size,delay){verts.push(x,y,z,color[0],color[1],color[2],size,delay,rand(.72,1))}
    function petalPoint(place,cx,cy,cz,r,angle,u,v,layer){
      const inner=r*(.06+layer*.035),length=r*[.92,.83,.69,.52,.37][layer];
      const radial=inner+u*length;
      const width=r*[.32,.29,.255,.21,.17][layer]*Math.pow(Math.sin(Math.PI*u),.68);
      const side=v*width;
      const a=angle+side/Math.max(radial,.08);
      const rr=radial+.045*r*Math.cos(v*Math.PI/2)*Math.sin(Math.PI*u);
      const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.88;
      const z=cz+[.015,.055,.105,.15,.19][layer]+r*(.13*Math.sin(Math.PI*u)+.115*v*v*Math.sin(Math.PI*u)-.055*u);
      const palette=[rgb.pale,rgb.pale,rgb.light,rgb.rose,rgb.deep];
      const c=Math.random()<.075?rgb.cream:palette[Math.min(4,Math.max(0,layer+(Math.random()<.28?1:0)))];
      place(x,y,z,c,rand(.027,.05),rand(0,.7));
    }
    function rose(cx,cy,cz,r,yaw,tilt,seed){
      // Each bloom is a real cupped 3D shell made from individual curved petals.
      const cyaw=Math.cos(yaw),syaw=Math.sin(yaw),ct=Math.cos(tilt),st=Math.sin(tilt);
      const place=(x,y,z,color,size,delay)=>{
        const py=y*ct-z*st,pz=y*st+z*ct;
        put(cx+x*cyaw+pz*syaw,cy+py,cz-x*syaw+pz*cyaw,color,size,delay);
      };
      const counts=[5,6,7,8,9];
      for(let layer=0;layer<counts.length;layer++){
        const n=counts[layer],offset=seed+layer*.47;
        for(let k=0;k<n;k++){
          const center=offset+k*2*Math.PI/n;
          for(let iy=0;iy<12;iy++)for(let ix=0;ix<20;ix++){
            const u=(iy+rand(.08,.92))/12,v=-1+2*(ix+rand(.08,.92))/20;
            petalPoint(place,0,0,0,r,center,u,v,layer);
          }
        }
      }
      // Rolled inner whorl and green sepals underneath the bloom.
      for(let i=0;i<180;i++){
        const a=i*.31,rr=r*(.025+.018*i/150);
        place(Math.cos(a)*rr,Math.sin(a)*rr,r*(.28-.04*i/150),i%4?rgb.cream:rgb.light,rand(.018,.03),rand(0,.35));
      }
      for(let i=0;i<210;i++){
        const a=rand(0,Math.PI*2),u=rand(.35,1),rr=r*(.12+u*.28);
        const x=cx+Math.cos(a)*rr,y=cy-r*.42+Math.sin(a)*rr*.25;
        place(x-cx,y-cy,-r*.12,rgb.leaf,rand(.018,.028),rand(.15,.7));
      }
    }
    function leaf(cx,cy,cz,length,angle){
      const direction=cx<0?-1:1;
      for(let i=0;i<900;i++){
        const u=Math.random(),v=rand(-1,1);
        const width=.24*Math.pow(Math.sin(Math.PI*u),.85);
        const px=cx+direction*length*u;
        const py=cy+.65*length*Math.sin(u*Math.PI*.6)+v*width;
        const pz=cz+.24*Math.sin(u*Math.PI)+Math.abs(v)*.10;
        const color=Math.abs(v)<.07?[.67,.83,.54]:(Math.random()<.38?rgb.leaf2:rgb.leaf);
        put(px,py,pz,color,rand(.017,.03),rand(.1,.8));
      }
    }
    function build(){
      verts.length=0;
      // Seventeen cupped roses form three rings around the bouquet, all facing outward.
      // This keeps several full flower faces toward the viewer from every point in the turn.
      const rings=[
        {count:6,y:1.94,radius:.91,flower:.69,offset:0,zLift:.12},
        {count:7,y:1.13,radius:1.02,flower:.68,offset:Math.PI/7,zLift:.10},
        {count:4,y:.40,radius:.69,flower:.61,offset:Math.PI/4,zLift:.06}
      ];
      let seed=1;
      for(const ring of rings)for(let i=0;i<ring.count;i++){
        const a=ring.offset+i*2*Math.PI/ring.count;
        rose(Math.sin(a)*ring.radius,ring.y,Math.cos(a)*ring.radius+ring.zLift,ring.flower,a,rand(-.16,.16),seed++*.73);
      }
      // A few forward blossoms fill the middle so the bouquet stays lush in every view.
      rose(-.38,.93,1.13,.62,-.14,-.10,19.1);rose(.38,.93,1.13,.62,.14,-.10,21.4);rose(0,1.76,1.24,.60,0,-.08,23.7);
      leaf(-.67,.46,.4,1.05,0);leaf(.67,.46,.4,1.05,0);
      leaf(-.93,1.05,-.35,.88,0);leaf(.93,1.05,-.35,.88,0);
      leaf(-.45,.15,-.6,1.0,0);leaf(.45,.15,-.6,1.0,0);
      // Three-dimensional folded wrapper shell, with front and side faces.
      for(let i=0;i<3100;i++){
        const y=rand(-2.62,.55),u=(y+2.62)/3.17,half=.22+1.1*u,x=rand(-half,half);
        const edge=Math.abs(x)/half,sideZ=Math.sqrt(Math.max(0,1-edge*edge))*.34;
        const pleat=Math.cos(x/half*Math.PI*4)*.10;
        const c=(x<-.38&&Math.random()<.58)?rgb.paper2:(Math.random()<.58?rgb.paper:rgb.paper2);
        put(x,y,.02+sideZ+pleat,c,rand(.012,.026),rand(.12,.9));
      }
      // Stems fan out in depth as well as width, so the back is visible during the turn.
      for(let stem=0;stem<7;stem++)for(let i=0;i<200;i++){
        const u=Math.random(),x0=(stem-3)*.075;
        put(x0*(1-u)+rand(-.13,.13)*u,-2.46-u*.9,(stem-3)*.075,Math.random()<.55?rgb.stem:rgb.leaf2,rand(.012,.023),rand(.25,1));
      }
      vertexCount=verts.length/9;
      buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
      const stride=9*4;
      for(const [name,count,offset] of [['aPosition',3,0],['aColor',3,3],['aSize',1,6],['aDelay',1,7],['aAlpha',1,8]]){
        const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,count,gl.FLOAT,false,stride,offset*4);
      }
    }
    const uniforms={time:gl.getUniformLocation(program,'uTime'),angle:gl.getUniformLocation(program,'uAngle'),scale:gl.getUniformLocation(program,'uScale'),center:gl.getUniformLocation(program,'uCenterY'),focal:gl.getUniformLocation(program,'uFocal'),viewport:gl.getUniformLocation(program,'uViewport'),dpr:gl.getUniformLocation(program,'uDpr')};
    function resize(){
      dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;gl.viewport(0,0,canvas.width,canvas.height);
      scale=Math.min(w*.91/4.9,h*.72/6.55);build();gl.uniform2f(uniforms.viewport,w,h);gl.uniform1f(uniforms.scale,scale);gl.uniform1f(uniforms.focal,12);gl.uniform1f(uniforms.center,1-2*.395);gl.uniform1f(uniforms.dpr,dpr);
    }
    function frame(now){
      requestAnimationFrame(frame);const t=(now-start)/1000;
      gl.clearColor(0,0,0,0);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(uniforms.time,t);gl.uniform1f(uniforms.angle,t*.14);gl.drawArrays(gl.POINTS,0,vertexCount);
    }
    addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
